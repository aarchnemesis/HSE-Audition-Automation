name: Atualização Diária do Dashboard HSE (Vercel)

# Executa duas vezes ao dia (início da manhã às 06:45 BRT e fim do expediente às 17:45 BRT)
# para manter os dados do dashboard online 100% atualizados na Vercel e capturar matrículas
# no mesmo dia em que são criadas, SEM disparar e-mails para a equipe.

on:
  schedule:
    # Duas vezes ao dia: 09:45 UTC (06:45 BRT) e 20:45 UTC (17:45 BRT) — minuto 45 para evitar fila de minuto cheio do GitHub Actions
    - cron: '45 9,20 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Disparar e-mail de alerta para a equipe HSE?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 📦 Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Instalar Dependências do Projeto
        run: pnpm install --frozen-lockfile

      - name: 🤖 Atualizar Dados & Gerar Dashboard HSE
        env:
          STORZ_URL: ${{ secrets.STORZ_URL }}
          STORZ_USER: ${{ secrets.STORZ_USER }}
          STORZ_PASS: ${{ secrets.STORZ_PASS }}
          HSE_DRIVE_FOLDER_ID: ${{ secrets.HSE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          SMARTSHEET_RPO_SHEET_ID: ${{ secrets.SMARTSHEET_RPO_SHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          HSE_EMAIL_TO: ${{ secrets.HSE_EMAIL_TO }}
          SKIP_EMAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email == false }}
        run: pnpm run hse-report

      - name: 💾 Commit & Push do Dashboard para a Vercel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no dashboard HSE."
          else
            git commit -m "chore(data): auto-update HSE dashboard"
            git pull origin main --rebase -X theirs
            git push origin HEAD:main
          fi
