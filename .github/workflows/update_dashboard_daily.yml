name: Atualização Diária do Dashboard HSE (Vercel)

# Executa duas vezes ao dia (início da manhã às 07:00 BRT e fim do expediente às 18:00 BRT)
# para manter os dados do dashboard online 100% atualizados na Vercel e capturar matrículas
# no mesmo dia em que são criadas, SEM disparar e-mails para a equipe.

on:
  schedule:
    # Duas vezes ao dia: 10:00 UTC (07:00 BRT) e 21:00 UTC (18:00 BRT)
    - cron: '0 10,21 * * *'
  workflow_dispatch: # Permite atualização manual a qualquer momento sem enviar e-mail

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Instalar Dependências do Projeto
        run: pnpm install --frozen-lockfile

      - name: 🤖 Atualizar Dados & Gerar Dashboard HSE (Sem E-mail)
        env:
          STORZ_URL: ${{ secrets.STORZ_URL }}
          STORZ_USER: ${{ secrets.STORZ_USER }}
          STORZ_PASS: ${{ secrets.STORZ_PASS }}
          HSE_DRIVE_FOLDER_ID: ${{ secrets.HSE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          SMARTSHEET_RPO_SHEET_ID: ${{ secrets.SMARTSHEET_RPO_SHEET_ID }}
        run: pnpm run hse-dash

      - name: 💾 Commit & Push do Dashboard para a Vercel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no dashboard HSE."
          else
            git commit -m "chore(data): auto-update HSE dashboard [skip ci]"
            git push origin main
          fi
