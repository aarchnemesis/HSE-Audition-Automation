name: Dashboard Executivo HSE (Diretoria & Operações)

# Envia atualização executiva do dashboard com link da Vercel, KPIs de conformidade
# e saúde das fontes de dados para Marcelo Freitas e Leonardo Gaem.
# Disparo toda Segunda, Quarta e Sexta na madrugada às 07:30 UTC (04:30 BRT).

on:
  # Agendamento desativado no GitHub Actions (centralizado na VPS Prometeu)
  # schedule:
  #   - cron: '30 7 * * 1,3,5'
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Forçar envio de e-mail independente do dia da semana?'
        type: boolean
        default: false

jobs:
  executive-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar Dependencias do Projeto
        run: pnpm install --frozen-lockfile

      - name: Disparar E-mail do Dashboard Executivo
        env:
          STORZ_URL: ${{ secrets.STORZ_URL }}
          STORZ_USER: ${{ secrets.STORZ_USER }}
          STORZ_PASS: ${{ secrets.STORZ_PASS }}
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          SMARTSHEET_RPO_SHEET_ID: ${{ secrets.SMARTSHEET_RPO_SHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EXEC_EMAIL_TO: ${{ secrets.EXEC_EMAIL_TO }}
          ALLOWED_EMAIL_DAYS: '1,3,5'
          FORCE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_email == true }}
        run: pnpm run exec-dashboard-email

      - name: Upload do Preview do E-mail Executivo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executive_dashboard_preview_${{ github.run_id }}
          path: scratch/executive_dashboard_preview.html
          retention-days: 7
          if-no-files-found: ignore

