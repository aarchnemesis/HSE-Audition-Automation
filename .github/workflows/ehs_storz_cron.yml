name: HSE Audit & Storz Automated Cron

on:
  schedule:
    # Segunda-feira às 09:15 UTC (06:15 BRT - Horário de Brasília)
    - cron: '15 9 * * 1'
  workflow_dispatch: # Permite execução manual a qualquer momento no GitHub Actions

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 📦 Instalar Dependências do Projeto
        run: npm ci
      - name: 🔎 Type-check
        run: npm run lint
      - name: 🧪 Rodar Testes
        run: npm test

  audit-and-notify:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar Dependências do Projeto
        run: npm ci

      - name: 🎭 Instalar Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: 🤖 Executar Auditoria Tripla & Gerar Relatório HSE
        env:
          STORZ_URL: ${{ secrets.STORZ_URL }}
          STORZ_USER: ${{ secrets.STORZ_USER }}
          STORZ_PASS: ${{ secrets.STORZ_PASS }}
          HSE_DRIVE_FOLDER_ID: ${{ secrets.HSE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          SMARTSHEET_RPO_SHEET_ID: ${{ secrets.SMARTSHEET_RPO_SHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          HSE_EMAIL_TO: ${{ secrets.HSE_EMAIL_TO }}
        run: npm run hse-report

      - name: 📊 Upload do Relatório Excel Consolidado
        uses: actions/upload-artifact@v4
        with:
          name: hse_relatorio_consolidado_${{ github.run_id }}
          path: scratch/hse_relatorio_consolidado.xlsx
          retention-days: 7

      - name: 🖥️ Upload do Dashboard HTML
        uses: actions/upload-artifact@v4
        with:
          name: hse_dashboard_${{ github.run_id }}
          path: scratch/hse_dashboard.html
          retention-days: 7

      - name: 💾 Commit & Push do Dashboard HSE para a Vercel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no dashboard HSE."
          else
            git commit -m "chore(data): auto-update HSE dashboard [skip ci]"
            git push origin main
          fi
